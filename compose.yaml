#toda la informacion de los servicios de docker

version: "3.1"

services:
  spring-boot:
    build: ./
    ports:
      - "8080:8080"
    healthcheck:
      test: [ "CMD", "curl", "f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 18s
      retries: 5
    environment:
      PROFILE: dev
